name: macOS source validation

on:
  push:
    branches: [main, "release/**", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Release security history audit must see reachable historical blobs.
          fetch-depth: 0
      - name: Check installer bootstrap with Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Validate installer planning on Python 3.9
        run: |
          python scripts/install_mac_control.py --plan
          status=0
          python scripts/release_preflight.py --json > "$RUNNER_TEMP/preflight.json" || status=$?
          test "$status" -eq 0 || test "$status" -eq 2
          python -c 'import json, os, pathlib; data = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "preflight.json").read_text()); assert isinstance(data["ready_for_guided_install"], bool)'
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/dev-frozen.txt
      - name: Audit current source tree
        run: python scripts/release_audit.py --strict
      - name: Audit committed Git history
        run: python scripts/release_history_audit.py
      - name: Validate Python sources
        run: python -m compileall -q src scripts tests
      - name: Install pinned dependencies
        run: python -m pip install -r requirements/dev-frozen.txt
      - name: Audit pinned dependency version and declared license metadata
        env:
          PYTHONPATH: "src:."
        run: python -P -B scripts/release_dependency_audit.py > "$RUNNER_TEMP/dependency-licenses.json"
      - name: Validate deterministic source release payload
        env:
          PYTHONPATH: "src:."
        run: |
          python -P -B scripts/release_payload_audit.py > "$RUNNER_TEMP/source-payload.json"
          python -c 'import json, os, pathlib; d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"source-payload.json").read_text()); assert d["files"] > 0 and len(d["sha256"]) == 64'
      - name: Build and verify signed native GUI candidate (without installation)
        env:
          PYTHONPATH: "src:."
        run: |
          python -P -B scripts/build_mac_control_gui.py --root "$RUNNER_TEMP/MacControlMCP" > "$RUNNER_TEMP/gui-build.json"
          codesign --verify --strict build/MacControlMCPServer.app
          echo '{"op":"native_backend","native_op":"apps"}' | build/MacControlMCPServer.app/Contents/MacOS/MacControlMCPServer > "$RUNNER_TEMP/native-staging-smoke.json"
          python -c 'import json, os, pathlib; d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"native-staging-smoke.json").read_text()); assert d["ok"] is True and isinstance(d["data"]["apps"],list)'
          python -c 'import json, os, pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"gui-build.json").read_text()); assert r["started"] is False and r["tcc_permissions_requested"] is False'
      - name: Run BF20 isolated browser handoff tests
        env:
          PYTHONPATH: "src:."
        run: |
          python -m pip install 'pytest==8.4.2'
          python -P -B -m pytest -q tests/integration/test_watcher_initial_dispatch_bf20.py tests/integration/test_watcher_initial_e2e_bf20.py tests/integration/test_watcher_owner_origin_bf20.py
      - name: Run source unit and integration tests
        env:
          PYTHONPATH: "src:."
        run: python -P -B -m unittest discover -s tests -p 'test_*.py' -q
